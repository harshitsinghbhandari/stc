name: Release

on:
  # Cut a release by pushing a version tag (e.g. v0.40.0).
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  # Allow cd.yml (or other workflows) to invoke this pipeline.
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
  # Manual trigger from the Actions tab.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.40.0)'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Binary/command name shipped by this fork.
  BIN_NAME: stc

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          # Linux
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            musl: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install musl tools
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ env.BIN_NAME }}-${{ matrix.target }}.${{ matrix.archive }} ${{ env.BIN_NAME }}
          cd ../../..

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ env.BIN_NAME }}-${{ matrix.target }}.${{ matrix.archive }} ${{ env.BIN_NAME }}.exe
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: ${{ env.BIN_NAME }}-${{ matrix.target }}.${{ matrix.archive }}

  build-deb:
    name: Build DEB package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build DEB
        run: cargo deb

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-deb
          path: target/debian/*.deb

  build-rpm:
    name: Build RPM package
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y rust cargo rpm-build

      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm

      - name: Build release
        run: cargo build --release

      - name: Generate RPM
        run: cargo generate-rpm

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-rpm
          path: target/generate-rpm/*.rpm

  release:
    name: Create Release
    needs: [build, build-deb, build-rpm]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version
        id: version
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.deb" -o -name "*.rpm" \) -exec cp {} release/ \;

      - name: Create version-agnostic package names
        run: |
          cd release
          for f in *.deb; do
            [ -f "$f" ] && cp "$f" "${BIN_NAME}_amd64.deb"
          done
          for f in *.rpm; do
            [ -f "$f" ] && cp "$f" "${BIN_NAME}.x86_64.rpm"
          done

      - name: Create checksums
        run: |
          cd release
          sha256sum * > checksums.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: release/*
          prerelease: ${{ inputs.prerelease }}
          # Uses the workflow's GITHUB_TOKEN to publish on this repository.
          token: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    name: Update Homebrew formula
    needs: [release]
    if: ${{ !inputs.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download checksums
        run: |
          gh release download "${{ steps.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse checksums
        id: sha
        run: |
          echo "mac_arm=$(grep ${BIN_NAME}-aarch64-apple-darwin.tar.gz checksums.txt | head -1 | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "mac_intel=$(grep ${BIN_NAME}-x86_64-apple-darwin.tar.gz checksums.txt | head -1 | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux_arm=$(grep ${BIN_NAME}-aarch64-unknown-linux-gnu.tar.gz checksums.txt | head -1 | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux_intel=$(grep ${BIN_NAME}-x86_64-unknown-linux-musl.tar.gz checksums.txt | head -1 | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Generate formula
        run: |
          cat > stc.rb << 'FORMULA'
          class Stc < Formula
            desc "stc (Save Token Cost) - CLI proxy to minimize LLM token consumption (fork of rtk)"
            homepage "https://github.com/harshitsinghbhandari/stc"
            version "VERSION_PLACEHOLDER"
            license "Apache-2.0"

            if OS.mac? && Hardware::CPU.arm?
              url "https://github.com/harshitsinghbhandari/stc/releases/download/TAG_PLACEHOLDER/stc-aarch64-apple-darwin.tar.gz"
              sha256 "SHA_MAC_ARM_PLACEHOLDER"
            elsif OS.mac? && Hardware::CPU.intel?
              url "https://github.com/harshitsinghbhandari/stc/releases/download/TAG_PLACEHOLDER/stc-x86_64-apple-darwin.tar.gz"
              sha256 "SHA_MAC_INTEL_PLACEHOLDER"
            elsif OS.linux? && Hardware::CPU.arm?
              url "https://github.com/harshitsinghbhandari/stc/releases/download/TAG_PLACEHOLDER/stc-aarch64-unknown-linux-gnu.tar.gz"
              sha256 "SHA_LINUX_ARM_PLACEHOLDER"
            elsif OS.linux? && Hardware::CPU.intel?
              url "https://github.com/harshitsinghbhandari/stc/releases/download/TAG_PLACEHOLDER/stc-x86_64-unknown-linux-musl.tar.gz"
              sha256 "SHA_LINUX_INTEL_PLACEHOLDER"
            end

            def install
              bin.install "stc"
            end

            def caveats
              <<~EOS
                stc is installed! Get started:

                  # Initialize for Claude Code
                  stc init -g          # Global hook-first setup (recommended)
                  stc init             # Add to ./CLAUDE.md (this project only)

                  # See all commands
                  stc --help

                  # Measure your token savings
                  stc gain

                Documentation: https://github.com/harshitsinghbhandari/stc
              EOS
            end

            test do
              assert_match "stc #{version}", shell_output("#{bin}/stc --version")
            end
          end
          FORMULA
          sed -i "s/VERSION_PLACEHOLDER/${{ steps.version.outputs.version }}/g" stc.rb
          sed -i "s/TAG_PLACEHOLDER/${{ steps.version.outputs.tag }}/g" stc.rb
          sed -i "s/SHA_MAC_ARM_PLACEHOLDER/${{ steps.sha.outputs.mac_arm }}/g" stc.rb
          sed -i "s/SHA_MAC_INTEL_PLACEHOLDER/${{ steps.sha.outputs.mac_intel }}/g" stc.rb
          sed -i "s/SHA_LINUX_ARM_PLACEHOLDER/${{ steps.sha.outputs.linux_arm }}/g" stc.rb
          sed -i "s/SHA_LINUX_INTEL_PLACEHOLDER/${{ steps.sha.outputs.linux_intel }}/g" stc.rb
          # Remove leading spaces from heredoc
          sed -i 's/^          //' stc.rb

      - name: Push to homebrew-tap
        run: |
          CONTENT=$(base64 -w 0 stc.rb)
          SHA=$(gh api repos/harshitsinghbhandari/homebrew-tap/contents/Formula/stc.rb --jq '.sha' 2>/dev/null || echo "")
          if [ -n "$SHA" ]; then
            gh api -X PUT repos/harshitsinghbhandari/homebrew-tap/contents/Formula/stc.rb \
              -f message="stc ${{ steps.version.outputs.version }}" \
              -f content="$CONTENT" \
              -f sha="$SHA"
          else
            gh api -X PUT repos/harshitsinghbhandari/homebrew-tap/contents/Formula/stc.rb \
              -f message="stc ${{ steps.version.outputs.version }}" \
              -f content="$CONTENT"
          fi
        env:
          # PAT with contents:write on harshitsinghbhandari/homebrew-tap.
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
