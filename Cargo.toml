[package]
name = "rtk"
version = "0.40.0"
edition = "2021"
authors = ["Patrick Szymkowiak", "Harshit Singh Bhandari"]
description = "stc (Save Token Cost) - High-performance CLI proxy to minimize LLM token consumption. A fork of rtk (Rust Token Killer)."
license = "Apache-2.0"
homepage = "https://github.com/harshitsinghbhandari/stc"
repository = "https://github.com/harshitsinghbhandari/stc"
readme = "README.md"
keywords = ["cli", "llm", "token", "filter", "productivity"]
categories = ["command-line-utilities", "development-tools"]

# The crate/package remains `rtk` internally to limit churn, but the
# user-facing binary/command is `stc`.
[[bin]]
name = "stc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
ignore = "0.4"
walkdir = "2"
regex = "1"
lazy_static = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
colored = "2"
dirs = "5"
rusqlite = { version = "0.31", features = ["bundled"] }
toml = "0.8"
chrono = "0.4"
tempfile = "3"
sha2 = "0.10"
ureq = "2"
getrandom = "0.4"
flate2 = "1.0"
quick-xml = "0.37"
which = "8"
automod = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
toml = "0.8"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# cargo-deb configuration
[package.metadata.deb]
name = "stc"
maintainer = "Harshit Singh Bhandari"
copyright = "2024 Patrick Szymkowiak; 2026 Harshit Singh Bhandari"
license-file = ["LICENSE", "0"]
extended-description = "stc filters and compresses command outputs before they reach your LLM context, saving 60-90% of tokens. A fork of rtk (Rust Token Killer)."
section = "utility"
priority = "optional"
assets = [
    ["target/release/stc", "usr/bin/", "755"],
]
# cargo-generate-rpm configuration
[package.metadata.generate-rpm]
name = "stc"
assets = [
    { source = "target/release/stc", dest = "/usr/bin/stc", mode = "755" },
]

[lints.rust]
unsafe_code = "deny"
warnings = "deny"
